services:
  postgres:
    image: postgres:17
    container_name: team1_trade_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-trading_platform}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/migrations:ro
      - ./seed:/seed:ro
      - ./infra/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -q &&
          psql -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -tAc
          "SELECT 1 FROM schema_migrations LIMIT 1" | grep -q 1
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s
    networks:
      - trading-net

  kafka:
    image: apache/kafka:3.8.0
    container_name: team1_kafka
    restart: unless-stopped
    profiles:
      - kafka
    environment:
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://<your_private_ip>:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    networks:
      - trading-net

  trade-api:
    build:
      context: .
      dockerfile: sprint-06-api/Dockerfile
    container_name: team1_trade_api
    restart: unless-stopped
    profiles:
      - platform
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      JWT_ISSUER: ${JWT_ISSUER:-auth-service}
      TRADE_CURRENCY: ${TRADE_CURRENCY:-USD}
      SERVER_PORT: 8080
      TRUSTME_KEY_FILE: /app/leapcapstoneteam1-720d03.TM
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
    ports:
      - "${TRADE_API_PORT:-8080}:8080"
    volumes:
      - ./leapcapstoneteam1-720d03.TM:/app/leapcapstoneteam1-720d03.TM:ro
    networks:
      - trading-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

networks:
  trading-net:
    name: trading_platform_net

volumes:
  pgdata:
spring.application.name=sprint-06-api

# TrustMe
# The key file lives at the repository root; this path assumes the app is run
# from sprint-06-api (IntelliJ and mvn both do). Override with --trustme.key-file=
trustme.key-file=../leapcapstoneteam1-720d03.TM

# Database Configuration
# Same secret names the Python scripts already use (see scripts/db_config.py)
spring.datasource.url=jdbc:postgresql://${trustme.secret.PostGres_Host}:${trustme.secret.Postgres_Port}/${trustme.secret.Postgres_DB}
spring.datasource.username=${trustme.secret.PostGres_User}
spring.datasource.password=${trustme.secret.PostGres}
spring.datasource.driver-class-name=org.postgresql.Driver
server.port=${SERVER_PORT:8081}

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# MyBatis Configuration
mybatis.mapper-locations=classpath*:/mapper/**/*.xml
mybatis.type-aliases-package=com.team1.trading.api
mybatis.configuration.map-underscore-to-camel-case=true

# JWT Configuration
# Secret key for HS256 signature verification. Must be shared with the auth service.
# For Sprint 6, this is read from the auth stub in services/auth-stub/README.md
# For Sprint 8, this comes from the real auth service configuration.
jwt.secret=${trustme.secret.JWT_SECRET}
jwt.issuer=${JWT_ISSUER:auth-service}

# Balance currency, ISO 4217
trade.currency=${TRADE_CURRENCY:USD}

# Kafka producer for the orders topic. Parts of this configuration are mandated by
# Sprint 7: acks=all and enable.idempotence=true so a producer retry cannot duplicate
# an accepted order, a high retry count, and at most five requests in flight per
# connection. The broker address is overridable with KAFKA_BOOTSTRAP_SERVERS.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.retries=2147483647
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5

# Kafka consumer for market-data, which keeps portfolio_holding.overall_gains current.
# The group id is the one contracts/kafka-topics.md assigns to the Portfolio and P&L
# concern; it must stay distinct from every other consumer's, or two services would split
# the partitions and each would see only part of the stream.
#
# auto-offset-reset=latest, not earliest: a quote is only useful while it is current, so on
# a first start there is nothing to gain from replaying a day of stale prices.
# Auto-commit is off and the listener acknowledges after the update, so a crash reprocesses
# a quote rather than losing it - and reprocessing is harmless, because the gain is
# recomputed from the price rather than accumulated.
spring.kafka.consumer.group-id=portfolio-service
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=com.team1.eventbus.Envelope
spring.kafka.consumer.properties.spring.json.trusted.packages=com.team1.eventbus
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.listener.ack-mode=manual_immediate

# Kafka payload prices are contracted as plain decimals, never 1.3E+3.
spring.jackson.generator.write-bigdecimal-as-plain=true

# Spring Boot executor + market-data poller on port 8082. Internal only: nothing outside calls it.
# Run ONE replica (it polls the market-data API).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: executor-service
spec:
  replicas: 1
  strategy: { type: Recreate }          # never two pollers at once during a rollout
  selector:
    matchLabels: { app: executor-service }
  template:
    metadata:
      labels: { app: executor-service }
    spec:
      # Kubernetes would otherwise add <SERVICE>_PORT=tcp://... variables for every Service, and
      # FRONTEND_PORT / AUTH_SERVICE_PORT collide with services.env (the app reads them as port numbers).
      enableServiceLinks: false
      securityContext: { runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001 }
      # Wait until Kafka answers before starting the app. Without this, starting the app while Kafka is
      # down (resuming in the wrong order, or a slow Kafka disk) crashes it with "No resolvable bootstrap
      # urls" and restarts it in a loop; with it the pod waits at Init:0/1 and starts by itself.
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z -w 2 kafka 29092; do echo waiting for kafka:29092; sleep 3; done"]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 32Mi }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
      containers:
        - name: executor-service
          image: etp-executor-service
          ports:
            - { name: http, containerPort: 8082 }
          envFrom:
            - configMapRef: { name: etp-config }
            - secretRef: { name: etp-secrets-env }
          env:
            - { name: SERVER_PORT, value: "8082" }
            - { name: JAVA_OPTS, value: "-XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError" }
          volumeMounts:
            - { name: shared-config, mountPath: /config, readOnly: true }
            - { name: tmp, mountPath: /tmp }
          startupProbe:
            tcpSocket: { port: http }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket: { port: http }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: http }
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests: { cpu: 250m, memory: 640Mi }
            limits: { memory: 1280Mi }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
      volumes:
        - name: shared-config
          configMap: { name: etp-shared-config }
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: executor-service
spec:
  type: ClusterIP
  selector: { app: executor-service }
  ports:
    - { name: http, port: 8082, targetPort: http }

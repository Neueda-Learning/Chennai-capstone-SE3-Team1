apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - storageclass.yaml
  - kafka.yaml
  - kafka-topics-job.yaml
  - auth-service.yaml
  - order-service.yaml
  - executor-service.yaml
  - frontend.yaml
  - secret.yml
configMapGenerator:
  - name: etp-config
    envs: [config.env]
  # Application/Config/services.env, mounted at /config/services.env in the app pods.
  # Kustomize cannot read files outside k8s/, so it is copied in first:
  #   cp Application/Config/services.env k8s/base/generated/services.env
  - name: etp-shared-config
    files: [services.env=generated/services.env]
# The Secret is declared as a plain secret.yml (not secretGenerator) so that
# Kubernetes creates it with the exact name 'etp-secrets' (no hash suffix).
# The CD pipeline writes the filled-in values into k8s/base/secrets.env before
# rendering the bundle, and kustomize builds the Secret from that file.
# The Secret is git-ignored; the CD run deletes k8s/base/secrets.env when done.
# The tag must be one that was actually pushed to ECR (aws ecr describe-images --repository-name ...).
# A unique tag per build (commit + suffix) makes every apply roll out exactly that build.
images:
  - name: etp-auth-service
    newName: 925645278975.dkr.ecr.ap-south-1.amazonaws.com/etp-auth-service
    newTag: 06609f2-eks2
  - name: etp-order-service
    newName: 925645278975.dkr.ecr.ap-south-1.amazonaws.com/etp-order-service
    newTag: 06609f2-eks2
  - name: etp-executor-service
    newName: 925645278975.dkr.ecr.ap-south-1.amazonaws.com/etp-executor-service
    newTag: 06609f2-eks2
  - name: etp-frontend
    newName: 925645278975.dkr.ecr.ap-south-1.amazonaws.com/etp-frontend
    newTag: 06609f2-eks2

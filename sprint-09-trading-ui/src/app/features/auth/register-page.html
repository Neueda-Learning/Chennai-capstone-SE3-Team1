<div class="login-wrapper">
  <div class="login-bg-shape login-bg-shape-1"></div>
  <div class="login-bg-shape login-bg-shape-2"></div>

  <div class="login-card">
    <span class="login-brand">
      <i class="bi bi-graph-up-arrow"></i>
      <span>Trading UI</span>
    </span>

    <p class="login-subtitle">Create your account to start trading</p>

    <form
      class="needs-validation"
      [class.was-validated]="submitted()"
      novalidate
      (submit)="onSubmit($event)"
    >
      <div class="login-form-group">
        <label for="username" class="login-form-label">Username</label>
        <div class="login-input-group">
          <i class="bi bi-person input-icon"></i>
          <input
            type="text"
            id="username"
            class="login-input"
            placeholder="jane.doe"
            required
            minlength="3"
            maxlength="64"
            pattern="[a-zA-Z0-9._-]+"
            autocomplete="username"
            autofocus
            data-testid="username"
            [value]="username()"
            (input)="onUsernameInput($event)"
          >
        </div>
      </div>

      <div class="login-form-group">
        <label for="email" class="login-form-label">Email</label>
        <div class="login-input-group">
          <i class="bi bi-envelope input-icon"></i>
          <input
            type="email"
            id="email"
            class="login-input"
            placeholder="jane.doe@example.com"
            required
            maxlength="150"
            autocomplete="email"
            data-testid="email"
            [value]="email()"
            (input)="onEmailInput($event)"
          >
        </div>
      </div>

      <div class="login-form-group">
        <label for="password" class="login-form-label">Password</label>
        <div class="login-input-group">
          <i class="bi bi-shield-lock input-icon"></i>
          <input
            [type]="passwordVisible() ? 'text' : 'password'"
            id="password"
            class="login-input login-input-password"
            placeholder="At least 12 characters"
            required
            minlength="12"
            maxlength="128"
            autocomplete="new-password"
            data-testid="password"
            [value]="password()"
            (input)="onPasswordInput($event)"
          >
          <button
            type="button"
            class="password-toggle-btn"
            [attr.aria-label]="passwordVisible() ? 'Hide password' : 'Show password'"
            (click)="togglePasswordVisibility()"
          >
            <i class="bi" [class.bi-eye]="!passwordVisible()" [class.bi-eye-slash]="passwordVisible()"></i>
          </button>
        </div>
      </div>

      <div class="login-form-group">
        <label for="confirm-password" class="login-form-label">Confirm Password</label>
        <div class="login-input-group">
          <i class="bi bi-shield-check input-icon"></i>
          <input
            [type]="confirmPasswordVisible() ? 'text' : 'password'"
            id="confirm-password"
            class="login-input login-input-password"
            placeholder="Repeat your password"
            required
            autocomplete="new-password"
            data-testid="confirm-password"
            [value]="confirmPassword()"
            (input)="onConfirmPasswordInput($event)"
          >
          <button
            type="button"
            class="password-toggle-btn"
            [attr.aria-label]="confirmPasswordVisible() ? 'Hide password' : 'Show password'"
            (click)="toggleConfirmPasswordVisibility()"
          >
            <i class="bi" [class.bi-eye]="!confirmPasswordVisible()" [class.bi-eye-slash]="confirmPasswordVisible()"></i>
          </button>
        </div>
      </div>

      @if (error(); as message) {
        <div class="alert alert-danger login-alert" role="alert" data-testid="register-error">
          <i class="bi bi-exclamation-triangle-fill me-2"></i>
          {{ message }}
        </div>
      }

      <button type="submit" class="btn-login" [disabled]="submitting()" data-testid="submit">
        @if (submitting()) {
          <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
        }
        <span>{{ submitting() ? 'Creating account…' : 'Create Account' }}</span>
        <i class="bi bi-arrow-right"></i>
      </button>
    </form>

    <p class="login-footer-text">
      Already have an account? <a routerLink="/login">Sign In</a>
    </p>
  </div>
</div>

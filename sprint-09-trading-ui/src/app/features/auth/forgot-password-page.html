<div class="login-wrapper">
  <div class="login-bg-shape login-bg-shape-1"></div>
  <div class="login-bg-shape login-bg-shape-2"></div>

  <div class="login-card">
    <span class="login-brand">
      <i class="bi bi-graph-up-arrow"></i>
      <span>Trading UI</span>
    </span>

    <p class="login-subtitle">Tell us the email on the account and we will send a reset code</p>

    <form
      class="needs-validation"
      [class.was-validated]="submitted()"
      novalidate
      (submit)="onSubmit($event)"
    >
      <div class="login-form-group">
        <label for="forgot-email" class="login-form-label">Email</label>
        <div class="login-input-group">
          <i class="bi bi-envelope input-icon"></i>
          <input
            type="email"
            id="forgot-email"
            class="login-input"
            placeholder="jane.doe@example.com"
            required
            maxlength="150"
            autocomplete="email"
            autofocus
            data-testid="forgot-email"
            [value]="email()"
            (input)="onEmailInput($event)"
          >
        </div>
      </div>

      @if (error(); as message) {
        <div class="alert alert-danger login-alert" role="alert" data-testid="forgot-error">
          <i class="bi bi-exclamation-triangle-fill me-2"></i>
          {{ message }}
        </div>
      }

      <button type="submit" class="btn-login" [disabled]="submitting()" data-testid="submit">
        @if (submitting()) {
          <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
        }
        <span>{{ submitting() ? 'Sending code…' : 'Send reset code' }}</span>
        <i class="bi bi-arrow-right"></i>
      </button>
    </form>

    <p class="login-footer-text">
      Remembered it? <a routerLink="/login">Back to sign in</a>
    </p>
  </div>
</div>

<div class="page-header">
  <div>
    <h1 class="page-title">Order Ticket</h1>
    <p class="page-subtitle">Buy or sell an instrument against your wallet balance.</p>
  </div>
</div>

<div class="row g-4">
  <div class="col-lg-7">
    <div class="card">
      <div class="card-header">
        <h2 class="card-title">New Order</h2>
      </div>

      <form (submit)="onSubmit($event)">
        <div class="mb-3 d-flex gap-2">
          <button
            type="button"
            class="btn-custom flex-grow-1"
            [class.btn-custom-primary]="side() === 'BUY'"
            [class.btn-custom-outline-primary]="side() !== 'BUY'"
            (click)="selectSide('BUY')"
          >
            <i class="bi bi-arrow-up-circle"></i> Buy
          </button>
          <button
            type="button"
            class="btn-custom flex-grow-1"
            [class.btn-custom-danger]="side() === 'SELL'"
            [class.btn-custom-outline-danger]="side() !== 'SELL'"
            (click)="selectSide('SELL')"
          >
            <i class="bi bi-arrow-down-circle"></i> Sell
          </button>
        </div>

        <div class="mb-3">
          <label for="symbol" class="form-label-custom">Symbol</label>
          <select id="symbol" class="form-select-custom">
            <option>RELIANCE</option>
            <option>INFY</option>
            <option>TCS</option>
            <option>TATASTEEL</option>
          </select>
        </div>

        <div class="mb-3">
          <span class="form-label-custom d-block">Order Type</span>
          <div class="d-flex gap-4">
            <label class="form-check-custom mb-0">
              <input
                type="radio"
                name="orderType"
                class="form-check-input-custom"
                [checked]="orderType() === 'MARKET'"
                (change)="selectOrderType('MARKET')"
              >
              <span>Market</span>
            </label>
            <label class="form-check-custom mb-0">
              <input
                type="radio"
                name="orderType"
                class="form-check-input-custom"
                [checked]="orderType() === 'LIMIT'"
                (change)="selectOrderType('LIMIT')"
              >
              <span>Limit</span>
            </label>
          </div>
        </div>

        <div class="row">
          <div class="col-6 mb-3">
            <label for="quantity" class="form-label-custom">Quantity</label>
            <input type="number" id="quantity" class="form-control-custom" placeholder="10" min="1">
          </div>
          <div class="col-6 mb-3">
            <label for="price" class="form-label-custom">Price</label>
            <input
              type="number"
              id="price"
              class="form-control-custom"
              placeholder="Market price"
              [disabled]="orderType() === 'MARKET'"
            >
          </div>
        </div>

        <button type="submit" class="btn-custom btn-custom-primary btn-custom-lg w-100">
          Review Order
        </button>
      </form>
    </div>
  </div>

  <div class="col-lg-5">
    <div class="card">
      <div class="card-header">
        <h2 class="card-title">Wallet</h2>
      </div>
      <div class="stat-label">Available Balance</div>
      <div class="stat-value">₹42,500.00</div>
    </div>
  </div>
</div>

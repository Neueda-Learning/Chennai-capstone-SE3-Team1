# Postgres, the Trade API and the auth service in containers. Every host and port comes from
# Application/Config/services.env; the repository's one .env overrides it and holds the secrets.
# Start with BOTH files, the shared config first (needs docker compose 2.24 or newer):
#
#   docker compose --env-file ../../Application/Config/services.env --env-file ../../.env up -d --build
#
# Inside a container there is no TrustMe vault, so every service uses its environment fallbacks, and
# there is no repository tree, so services.env reaches each container through env_file below.
services:
  postgres:
    image: postgres:17
    container_name: team1_trade_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-trading_platform}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${POSTGRES_PORT:?set in Application/Config/services.env}:${POSTGRES_CONTAINER_PORT:?set in Application/Config/services.env}"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../../Application/Databases/PostgreSQL/migrations:/migrations:ro
      - ../../Application/Databases/PostgreSQL/seeds:/seed:ro
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -q &&
          psql -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -tAc
          "SELECT 1 FROM schema_migrations LIMIT 1" | grep -q 1
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s
    networks:
      - trading_net

  trade-api:
    build:
      # The Dockerfile copies paths from the repository root, so that is the build context.
      context: ../..
      dockerfile: Application/Services/order-service/Dockerfile
      target: trade-api
      args:
        TRADE_API_CONTAINER_PORT: ${TRADE_API_CONTAINER_PORT:?set in Application/Config/services.env}
    container_name: team1_trade_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ../../Application/Config/services.env
    environment:
      # Postgres is reached by service name; localhost inside a container is the container.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: ${POSTGRES_CONTAINER_PORT:?set in Application/Config/services.env}
      POSTGRES_DB: ${POSTGRES_DB:-trading_platform}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      # Shared with the auth service, so tokens it signs verify here.
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-auth-service}
      FAUXNANCE_API_KEY: ${FAUXNANCE_API_KEY:-}
      FAUXNANCE_BASE_URL: ${FAUXNANCE_BASE_URL:?set in Application/Config/services.env}
      # Where Kafka is, as the shared config (or your .env) says.
      KAFKA_HOST: ${KAFKA_HOST:?set in Application/Config/services.env}
      KAFKA_PORT: ${KAFKA_PORT:?set in Application/Config/services.env}
      TRADE_CURRENCY: ${TRADE_CURRENCY:-INR}
    ports:
      - "${TRADE_API_PORT:?set in Application/Config/services.env}:${TRADE_API_CONTAINER_PORT:?set in Application/Config/services.env}"
    networks:
      - trading_net
    healthcheck:
      # SERVER_PORT is baked into the image from TRADE_API_CONTAINER_PORT.
      test: ["CMD-SHELL", "curl -fsS http://localhost:$$SERVER_PORT/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  auth-service:
    build:
      context: ../../Application/Services/auth-service
      dockerfile: Dockerfile
      args:
        AUTH_SERVICE_PORT: ${AUTH_SERVICE_PORT:?set in Application/Config/services.env}
    container_name: team1_auth_service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ../../Application/Config/services.env
    environment:
      JWT_SECRET: ${JWT_SECRET}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: ${POSTGRES_CONTAINER_PORT:?set in Application/Config/services.env}
      POSTGRES_DB: ${POSTGRES_DB:-trading_platform}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      AUTH_PRIVATE_KEY: ${AUTH_PRIVATE_KEY:-}
      KAFKA_HOST: ${KAFKA_HOST:?set in Application/Config/services.env}
      KAFKA_PORT: ${KAFKA_PORT:?set in Application/Config/services.env}
    ports:
      - "${AUTH_SERVICE_PORT:?set in Application/Config/services.env}:${AUTH_SERVICE_PORT:?set in Application/Config/services.env}"
    networks:
      - trading_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:$$AUTH_SERVICE_PORT/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

networks:
  trading_net:
    name: trading_platform_net

volumes:
  pgdata:

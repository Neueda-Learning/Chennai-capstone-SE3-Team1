# Variables come from the repository's one .env:  docker compose --env-file ../../.env up -d
# Inside a container there is no TrustMe vault, so every service uses its environment fallbacks.
services:
  postgres:
    image: postgres:17
    container_name: team1_trade_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-trading_platform}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../../Application/Databases/PostgreSQL/migrations:/migrations:ro
      - ../../Application/Databases/PostgreSQL/seeds:/seed:ro
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -q &&
          psql -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -tAc
          "SELECT 1 FROM schema_migrations LIMIT 1" | grep -q 1
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s
    networks:
      - trading_net

  trade-api:
    build:
      context: ../../Application/Services/order-service
      dockerfile: Dockerfile
    container_name: team1_trade_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Postgres is reached by service name; localhost inside a container is the container.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-trading_platform}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      # Shared with the auth service, so tokens it signs verify here.
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-auth-service}
      FAUXNANCE_API_KEY: ${FAUXNANCE_API_KEY:-}
      FAUXNANCE_BASE_URL: ${FAUXNANCE_BASE_URL:-}
      TRADE_CURRENCY: ${TRADE_CURRENCY:-INR}
    ports:
      - "${TRADE_API_PORT:-8080}:8080"
    networks:
      - trading_net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  auth-service:
    build:
      context: ../../Application/Services/auth-service
      dockerfile: Dockerfile
    container_name: team1_auth_service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      JWT_SECRET: ${JWT_SECRET}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-trading_platform}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      AUTH_PRIVATE_KEY: ${AUTH_PRIVATE_KEY:-}
      KAFKA_BROKER: ${KAFKA_BROKER:-localhost:29092}
    ports:
      - "${AUTH_PORT:-3000}:3000"
    networks:
      - trading_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

networks:
  trading_net:
    name: trading_platform_net

volumes:
  pgdata:
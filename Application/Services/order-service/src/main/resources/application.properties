spring.application.name=sprint-06-api

trustme.key-file=../../../leapcapstoneteam1-720d03.TM

spring.datasource.url=jdbc:postgresql://${trustme.secret.PostGres_Host}:${trustme.secret.Postgres_Port}/${trustme.secret.Postgres_DB}
spring.datasource.username=${trustme.secret.PostGres_User}
spring.datasource.password=${trustme.secret.PostGres}
spring.datasource.driver-class-name=org.postgresql.Driver
server.port=8081

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

mybatis.mapper-locations=classpath*:/mapper/**/*.xml
mybatis.type-aliases-package=com.team1.trading.api
mybatis.configuration.map-underscore-to-camel-case=true

jwt.secret=${trustme.secret.JWT_SECRET}
jwt.issuer=auth-service

trade.currency=INR

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.retries=2147483647
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5

spring.kafka.consumer.group-id=portfolio-service
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=com.team1.eventbus.Envelope
spring.kafka.consumer.properties.spring.json.trusted.packages=com.team1.eventbus
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.listener.ack-mode=manual_immediate

spring.jackson.generator.write-bigdecimal-as-plain=true

fauxnance.base-url=${trustme.secret.Fauxnance_Endpoint}
fauxnance.api-key=${trustme.secret.Fauxnance}
fauxnance.symbol-suffix=.NS
fauxnance.timeout-seconds=10

# Daily ETL (ADR 0015): refresh the warehouse and publish the analysis once per analysis day. The day turns
# over at the cutoff (after the market closes); a start before it serves yesterday's run. Checked at start-up
# and every 15 minutes; a day already SUCCEEDED or PARTIAL in etl_daily_runs is never run again.
etl.daily.enabled=true
etl.daily.python=python
etl.daily.workdir=
etl.daily.cutoff=16:30
etl.daily.zone=Asia/Kolkata
etl.daily.check-interval-ms=900000
etl.daily.timeout-minutes=45
etl.daily.max-attempts=3

# Conditional orders (ADR 0012): held in orders as PENDING and checked against the latest quotes every minute.
# Set conditional-orders.release.enabled=false to keep checking but release nothing (a kill switch).
conditional-orders.poll-interval-ms=60000
conditional-orders.release.enabled=true


# Assistant chat (Gemini). The API key is the TrustMe secret LLM_API_KEY; without it the assistant is off.
# Models are tried in this order: the free tier's newer models are sometimes overloaded.
chat.base-url=https://generativelanguage.googleapis.com/v1beta
chat.models=gemini-3.1-flash-lite,gemini-3.5-flash-lite,gemini-3.5-flash
chat.timeout-seconds=45
# How long a model reasons before answering: low is much faster. Blank = the model's default.
chat.thinking-level=low
chat.rate-limit.messages=20
chat.rate-limit.window-seconds=300

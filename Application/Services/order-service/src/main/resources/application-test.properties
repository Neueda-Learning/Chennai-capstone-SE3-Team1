trustme.enabled=false
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
mybatis.mapper-locations=
jwt.secret=${JWT_SECRET:test-secret-key}
jwt.issuer=auth-service
trade.currency=USD
fauxnance.api-key=test-key
fauxnance.base-url=http://localhost:1

orders.republish-on-startup=false

notifications.scheduler.enabled=false
watchlists.scheduler.enabled=false

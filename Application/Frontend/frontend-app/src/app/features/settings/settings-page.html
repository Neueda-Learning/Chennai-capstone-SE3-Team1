<div class="page-header">
  <div>
    <h1 class="page-title">Settings</h1>
    <p class="page-subtitle">Preferences saved in this browser.</p>
  </div>
</div>

<div class="row g-4">
  <div class="col-lg-6">
    <div class="card h-100">
      <div class="card-header">
        <h2 class="card-title">Appearance</h2>
      </div>
      <div class="d-flex gap-2" role="radiogroup" aria-label="Theme">
        @for (option of themes; track option.value) {
          <button
            type="button"
            role="radio"
            class="btn-custom flex-grow-1"
            [attr.data-testid]="'theme-' + option.value"
            [attr.aria-checked]="theme.theme() === option.value"
            [class.btn-custom-primary]="theme.theme() === option.value"
            [class.btn-custom-outline-primary]="theme.theme() !== option.value"
            (click)="setTheme(option.value)"
          >
            <i class="bi" [class]="'bi ' + option.icon"></i> {{ option.label }}
          </button>
        }
      </div>
    </div>
  </div>

  <div class="col-lg-6">
    <div class="card h-100">
      <div class="card-header">
        <h2 class="card-title">Notifications</h2>
      </div>
      <label class="form-check-custom mb-2">
        <input
          type="checkbox"
          class="form-check-input-custom"
          data-testid="popups-toggle"
          [checked]="notifications.popupsEnabled()"
          (change)="setPopups($event)"
        />
        <span>Show a pop-up at the bottom right when something happens</span>
      </label>
      <p class="small text-muted-green mb-0">
        With pop-ups off, notifications still collect in the bell at the top of the page.
      </p>
    </div>
  </div>
</div>

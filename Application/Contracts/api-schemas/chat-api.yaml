openapi: 3.1.0

info:
  title: Assistant chat
  version: 1.0.0
  summary: One route that answers a customer's question about their own portfolio and the market.
  description: |
    Served by the Trade API (order-service). The route needs the same bearer token as every account
    route, and the path account must be the token's account (`ACC-403` otherwise).

    The server keeps no conversation: the client sends the recent turns with each question. Only
    `user` and `assistant` turns are accepted, so a client cannot supply a system or tool turn.

    The assistant is read-only. `suggestions` are orders it thinks the customer should consider; none is
    placed. A client shows each one as a button that opens the order form pre-filled
    (`/app/orders?symbol=TCS&side=SELL&quantity=20`), and the customer places the order themselves.

    Alerts and watchlists work the same way: the assistant reads them, and `alertProposals` and
    `watchlistProposals` are things it suggests. Nothing is created by the chat call. The client shows each
    as a card, and only when the customer confirms does it call the ordinary alert or watchlist endpoints
    as them. `links` are "go there" buttons to the app's own pages.

    ## Errors

    | Code | HTTP | Meaning |
    |---|---|---|
    | `VAL-422` | 422 | Empty conversation, more than 20 messages, a message over 1,500 characters, or a role other than `user`/`assistant`. |
    | `ACC-403` | 403 | The token is not for this account. |
    | `CHT-429` | 429 | The account has used its allowance (20 messages per 5 minutes). |
    | `CHT-503` | 503 | The assistant is not configured or the model could not be reached. |

servers:
  - url: http://localhost:8081

paths:
  /api/v1/accounts/{id}/chat:
    post:
      operationId: chat
      summary: Ask the assistant a question
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: The assistant's answer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Error:
      description: The service's normal error envelope.
      content:
        application/json:
          schema:
            type: object
            required: [errorCode, message]
            properties:
              errorCode: { type: string, example: CHT-429 }
              message: { type: string }

  schemas:
    ChatRequest:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            required: [role, text]
            properties:
              role: { type: string, enum: [user, assistant] }
              text: { type: string, minLength: 1, maxLength: 1500 }

    OrderSuggestion:
      type: object
      required: [symbol, side, quantity, reason]
      properties:
        symbol: { type: string, example: TCS }
        side: { type: string, enum: [BUY, SELL] }
        quantity: { type: integer, minimum: 1, maximum: 10000, description: A sale never exceeds the holding. }
        reason: { type: string, maxLength: 300 }

    ChatResponse:
      type: object
      required: [reply, suggestions]
      properties:
        reply:
          type: string
          description: |
            Plain text with simple bold (double asterisks), italic (single asterisks) and "* " bullets.
            Render it as text, never as HTML.
        suggestions:
          type: array
          maxItems: 3
          items:
            $ref: '#/components/schemas/OrderSuggestion'
        alertProposals:
          type: array
          maxItems: 3
          items:
            type: object
            required: [symbol, threshold, direction, reason, currentPrice, percentFromNow]
            properties:
              symbol: { type: string }
              threshold: { type: number, description: Rounded to two decimals; within 0.2x to 5x of the live price. }
              direction: { type: string, enum: [ABOVE, BELOW], description: Worked out from the level against the live price. }
              reason: { type: string, maxLength: 300 }
              currentPrice: { type: number }
              percentFromNow: { type: number }
        watchlistProposals:
          type: array
          maxItems: 2
          items:
            type: object
            required: [mode, name, symbols, reason]
            properties:
              mode: { type: string, enum: [CREATE, ADD], description: ADD when the name matches a watchlist the customer already has. }
              name: { type: string, maxLength: 60 }
              watchlistId: { type: string, nullable: true, description: Set for ADD. }
              symbols: { type: array, maxItems: 25, items: { type: string }, description: Tradable instruments only; for ADD, only those not already on the list. }
              reason: { type: string, maxLength: 300 }
        links:
          type: array
          maxItems: 3
          items:
            type: object
            required: [label, path, query]
            properties:
              label: { type: string, maxLength: 60 }
              path:
                type: string
                enum: [/app/dashboard, /app/portfolio, /app/orders, /app/blotter, /app/watchlists, /app/account, /app/settings, /app/bank-accounts]
              query:
                type: object
                additionalProperties: { type: string }
                description: symbol, side and quantity for /app/orders; alert for /app/watchlists; q for /app/blotter.

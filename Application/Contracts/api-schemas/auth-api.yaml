openapi: 3.1.0

info:
  title: Auth service
  version: 1.0.0
  summary: Registration, email verification, login, password reset, token refresh, logout and current-user lookup for the Enterprise Trading Platform.
  description: |
    Binding contract for the NestJS auth service built in Sprint 8. The Trade REST API and Angular
    UI must depend on this contract rather than on implementation details.

    ## JWT claims contract

    This section is normative. A token that does not carry exactly these claims breaks the Trade
    REST API's authorisation check.

    | Claim | Type | Meaning |
    |---|---|---|
    | `sub` | string | The user identifier. A UUID. Stable for the life of the user. Not the username, not the email, because both can change. |
    | `accountId` | integer or null | The numeric trading account key, `clients.client_id`. `null` until the user links a bank account through the Trade REST API's `POST /api/v1/bank-accounts`; the claim is always present. The Trade REST API compares this against the account in the request path or body and returns `ACC-403` if they differ or if it is `null`. |
    | `roles` | array of string | Authorisation roles. `CUSTOMER` for a normal trading user, `ADMIN` for an operator. Always present, never empty. |
    | `iat` | integer | Issued-at, seconds since the Unix epoch. |
    | `exp` | integer | Expiry, seconds since the Unix epoch. Fifteen minutes after `iat` for an access token. |
    | `iss` | string | Issuer. Use `auth-service` for the Sprint 8 service. Consumers must validate the configured issuer. |

    Decoded example:

    ```json
    {
      "sub": "8f14e45f-ceea-4c1b-9d3b-1a2b3c4d5e6f",
      "accountId": 1,
      "roles": ["CUSTOMER"],
      "iat": 1790000000,
      "exp": 1790000900,
      "iss": "auth-service"
    }
    ```

    Signing: `HS256` with a shared secret in development, read from `JWT_SECRET`. The auth service
    and Trade REST API must use the same algorithm and secret. Move to `RS256` with a published public key
    if a team wants the Trade REST API to verify without holding the signing secret. That is a
    documented upgrade, not a requirement.

    Lifetimes: access token 15 minutes, refresh token 7 days. Access tokens are not revocable, which
    is why they are short. Refresh tokens are stored and can be revoked.

    ## Security rules

    These are assessed in the Sprint 8 security review.

    - Store passwords with argon2id or bcrypt at cost 12 or above. Never MD5, never SHA-256, never
      an unsalted hash.
    - Never log a password, a token, or a refresh token, including inside an error object.
    - Return the same response body, the same status and comparable timing for an unknown user and
      for a wrong password. A different response for each is a user enumeration vulnerability.
    - Rotate the refresh token on every refresh, and invalidate the one that was presented. A
      refresh token that is presented twice indicates theft: revoke the whole chain.
    - Let a caller revoke their own current session with `POST /auth/logout` without forcing every
      other session they're logged into elsewhere to re-authenticate too.
    - Validate the signature, the expiry and the issuer on every protected request. Never trust a
      decoded payload that has not had its signature checked.
    - Do not put anything in a JWT that you would not publish. The payload is base64, not encrypted.

    ## Email verification rules

    Registration creates the user as `PENDING` and emails a six-digit one-time code. A `PENDING`
    user cannot sign in. `POST /auth/verify-otp` turns the account `ACTIVE`.

    - A code is stored only as a SHA-256 digest, never in the clear, and only its digest is ever
      logged. Issuing a replacement burns the code it replaces, and a code is single-use.
    - A code expires after ten minutes and is burnt after five wrong guesses. `AUTH-410` is
      returned for every failure - no code, wrong digits, expired, spent - so the response cannot
      be used to discover which addresses have accounts.
    - `POST /auth/forgot-password` and `POST /auth/resend-otp` always answer `200` with `sent: true`,
      whether or not the address is on file. A `404` there would turn the route into a directory of
      accounts.
    - A password reset revokes every refresh token for that user, so whoever prompted the reset is
      signed out everywhere.
  contact:
    name: Enterprise Trading Platform, programme materials
  license:
    name: Instructional use only

servers:
  - url: http://localhost:3000
    description: Local development.
  - url: http://auth-service:3000
    description: Service name inside the Docker Compose network.

tags:
  - name: Auth
    description: Registration, login and token lifecycle.
  - name: Verification
    description: Email verification and password reset.
  - name: Profile
    description: The authenticated user.

paths:
  /auth/register:
    post:
      tags: [Auth]
      operationId: register
      security: []
      summary: Register a user
      description: |
        Creates a user and nothing else, with `status` `PENDING`, and emails a six-digit code to
        `email`. The user cannot sign in until `POST /auth/verify-otp` returns `verified: true`;
        login with the right password in the meantime returns `AUTH-401`. Until a bank account is
        linked, a token's `accountId` is `null` and the Trade REST API refuses every account and
        order route - that is the Trade REST API's `POST /api/v1/bank-accounts`.

        Registration returns no tokens. The client verifies the code and then logs in. Returning a
        session from a registration endpoint makes it an unauthenticated session factory, and any
        weakness in it becomes an authentication bypass.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User created, awaiting email verification.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '409':
          description: The username or the email is already registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                taken:
                  value:
                    errorCode: AUTH-409
                    message: Registration failed
        '422':
          $ref: '#/components/responses/InvalidInput'

  /auth/verify-otp:
    post:
      tags: [Verification]
      operationId: verifyOtp
      security: []
      summary: Verify the emailed registration code and activate the account
      description: |
        Spends the code and moves the account from `PENDING` to `ACTIVE`, so the next login works.
        Every failure is `AUTH-410` with the same body: an address with no account, a code that is
        wrong, spent or expired, and an account that is already `ACTIVE`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOtpRequest'
            examples:
              verify:
                value:
                  email: priya.menon@example.com
                  otp: '123456'
      responses:
        '200':
          description: The account is now `ACTIVE`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpVerifiedResponse'
        '410':
          $ref: '#/components/responses/CodeInvalid'
        '422':
          $ref: '#/components/responses/InvalidInput'

  /auth/forgot-password:
    post:
      tags: [Verification]
      operationId: forgotPassword
      security: []
      summary: Email a password-reset code
      description: |
        Emails a six-digit reset code that expires after ten minutes. Always answers `200` with
        `sent: true`, whether or not the address has an account, so this route cannot be used to
        discover which addresses exist. The user learns the outcome by trying the code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '200':
          description: Accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpSentResponse'
        '422':
          $ref: '#/components/responses/InvalidInput'

  /auth/resend-otp:
    post:
      tags: [Verification]
      operationId: resendOtp
      security: []
      summary: Re-send the registration code
      description: |
        Issues a fresh registration code for a `PENDING` account, burning the earlier one so it
        stops working. Always answers `200` with `sent: true`, whatever the address or the account
        state, so the response reveals nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '200':
          description: Accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpSentResponse'
        '422':
          $ref: '#/components/responses/InvalidInput'

  /auth/reset-password:
    post:
      tags: [Verification]
      operationId: resetPassword
      security: []
      summary: Set a new password with an emailed code
      description: |
        Spends a reset code, stores the new password under the same policy as registration, and
        revokes every refresh token for that user. A new password that fails the policy returns
        `VAL-422` before the code is spent, so it can be corrected without another email. A wrong
        or spent code returns `AUTH-410`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
            examples:
              reset:
                value:
                  email: priya.menon@example.com
                  otp: '123456'
                  newPassword: 'correct horse battery staple'
      responses:
        '200':
          description: Password changed; every session revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetResponse'
        '410':
          $ref: '#/components/responses/CodeInvalid'
        '422':
          $ref: '#/components/responses/InvalidInput'

  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      security: []
      summary: Log in and receive tokens
      description: |
        Verifies the credentials and issues an access token and a refresh token. Every failure,
        whatever its cause, returns `AUTH-401`. One exception: an account still `PENDING` its email
        verification gets a message saying so. That branch is only reachable with the correct
        password, so it tells the caller nothing they do not already know.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              login:
                value:
                  username: priya.menon
                  password: 'correct horse battery staple'
      responses:
        '200':
          description: Authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '422':
          $ref: '#/components/responses/InvalidInput'

  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refresh
      security: []
      summary: Exchange a refresh token for a new token pair
      description: |
        Consumes the presented refresh token and issues a new pair. The presented token stops working
        immediately. Presenting a token that has already been consumed is treated as theft: revoke
        every refresh token for that user and return `AUTH-401`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: A new token pair.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '422':
          $ref: '#/components/responses/InvalidInput'

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoke the caller's current refresh token
      description: |
        Revokes only the presented refresh token; other sessions the user is logged into
        elsewhere are unaffected. Protected: the access token in `Authorization` identifies the
        caller, and the presented refresh token must be theirs - one that is unknown or belongs
        to someone else returns the same `AUTH-401` either way. Logging out twice with the same
        token is a no-op the second time, not an error.

        The access token itself is not revocable and keeps working until it expires (up to 15
        minutes); only the refresh token is revoked, so no new access token can be minted once
        it does.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Logged out.
        '401':
          $ref: '#/components/responses/Unauthorised'
        '422':
          $ref: '#/components/responses/InvalidInput'

  /auth/me:
    get:
      tags: [Profile]
      operationId: getCurrentUser
      summary: Get the authenticated user
      description: |
        Returns the user identified by the access token. Protected. The UI calls it after login to
        populate the dashboard greeting and to learn which account to address.

        Read the identity from the verified token, never from a query parameter or a header the
        client controls. Accepting a client-supplied user identifier here is OWASP A01.
      responses:
        '200':
          description: The authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorised'

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: An access token issued by `/auth/login` or `/auth/refresh`.

  responses:
    Unauthorised:
      description: |
        Authentication failed. Returned for an unknown username, a wrong password, an expired token,
        a wrongly signed token, a consumed refresh token and a malformed header. The body is
        identical in every case, on purpose.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unauthorised:
              value:
                errorCode: AUTH-401
                message: Unauthorised
    InvalidInput:
      description: The request failed field validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalid:
              value:
                errorCode: VAL-422
                message: Invalid input
    CodeInvalid:
      description: |
        The one-time code is wrong, spent, expired, or there is no code at all - and the service
        answers the same way in every case, so this cannot be used to discover which addresses have
        an account. 410 rather than 401: the request was understood, the code it carried is gone.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            gone:
              value:
                errorCode: AUTH-410
                message: The verification code is invalid or has expired

  schemas:

    RegisterRequest:
      type: object
      additionalProperties: false
      required: [username, email, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 64
          pattern: '^[a-zA-Z0-9._-]+$'
          example: priya.menon
        password:
          type: string
          minLength: 12
          maxLength: 128
          description: |
            Minimum twelve characters, at least one number or special character, and none of the
            literal string `password` or a run of four sequential or adjacent keyboard characters
            (`1234`, `3456`, `asdf`, `qwer`). Length beats character-class rules, so no rule here
            pushes a user towards a shorter password.
          writeOnly: true
        email:
          type: string
          format: email
          maxLength: 150
          description: Stored trimmed and lower-cased. Unique across users.
          example: priya.menon@example.com
        roles:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Role'
          description: |
            Optional. Defaults to `["CUSTOMER"]`. Ignore this field on a public registration route
            unless the caller already holds an `ADMIN` token. Accepting a self-declared role is a
            privilege-escalation bug, and the Sprint 8 security review looks for it.
      example:
        username: priya.menon
        email: priya.menon@example.com
        password: 'correct horse battery staple'

    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          maxLength: 64
        password:
          type: string
          maxLength: 128
          writeOnly: true

    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          description: The refresh token issued by the previous login or refresh.

    EmailRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 150
          description: Stored trimmed and lower-cased, so a code matches however the address was typed.
          example: priya.menon@example.com

    VerifyOtpRequest:
      type: object
      additionalProperties: false
      required: [email, otp]
      properties:
        email:
          type: string
          format: email
          maxLength: 150
        otp:
          type: string
          pattern: '^\d{6}$'
          minLength: 6
          maxLength: 6
          description: The six digits from the email. Single-use, ten-minute lifetime, five guesses.
          writeOnly: true
          example: '123456'

    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [email, otp, newPassword]
      properties:
        email:
          type: string
          format: email
          maxLength: 150
        otp:
          type: string
          pattern: '^\d{6}$'
          minLength: 6
          maxLength: 6
          writeOnly: true
          example: '123456'
        newPassword:
          type: string
          minLength: 12
          maxLength: 128
          description: Held to the same policy as `RegisterRequest.password`.
          writeOnly: true

    OtpSentResponse:
      type: object
      additionalProperties: false
      required: [sent]
      properties:
        sent:
          type: boolean
          description: Always `true`. There is no value for a caller to branch on, by design.
          example: true

    OtpVerifiedResponse:
      type: object
      additionalProperties: false
      required: [verified]
      properties:
        verified:
          type: boolean
          example: true

    PasswordResetResponse:
      type: object
      additionalProperties: false
      required: [reset]
      properties:
        reset:
          type: boolean
          example: true

    TokenResponse:
      type: object
      additionalProperties: false
      required: [accessToken, refreshToken, tokenType, expiresIn]
      properties:
        accessToken:
          type: string
          description: Signed JWT carrying the claims contract described in the service description.
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiI4ZjE0ZTQ1Zi1jZWVhLTRjMWItOWQzYi0xYTJiM2M0ZDVlNmYifQ.signature
        refreshToken:
          type: string
          description: Opaque, stored server-side, revocable, rotated on every use.
          example: 9c1f7a2e4b6d8e0a2c4e6a8c0e2a4c6e8a0c2e4a6c8e0a2c
        tokenType:
          type: string
          const: Bearer
        expiresIn:
          type: integer
          description: Access token lifetime in seconds.
          example: 900

    UserResponse:
      type: object
      additionalProperties: false
      required: [id, username, email, phone, accountId, roles, status]
      properties:
        id:
          type: string
          format: uuid
          description: The value carried in the `sub` claim.
          example: 8f14e45f-ceea-4c1b-9d3b-1a2b3c4d5e6f
        username:
          type: string
          example: priya.menon
        email:
          type: string
          format: email
          example: priya.menon@example.com
        phone:
          type: [string, 'null']
          description: Set only via the Trade API's profile-update route once a bank account is linked. `null` until then - never collected at registration.
          example: null
        accountId:
          type: [integer, 'null']
          format: int64
          description: The numeric trading account key, `clients.client_id`. `null` until a bank account is linked.
          example: 1
        roles:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Role'
          example: [CUSTOMER]
        status:
          type: string
          enum: [PENDING, ACTIVE]
          description: |
            `PENDING` for a registration whose emailed code has not been verified yet. A `PENDING`
            account cannot sign in.
          example: ACTIVE
        createdOn:
          type: string
          format: date-time
          example: '2026-10-05T08:00:00Z'

    Role:
      type: string
      enum: [CUSTOMER, ADMIN]

    ErrorResponse:
      type: object
      additionalProperties: false
      required: [errorCode, message]
      description: |
        The same envelope the Trade REST API uses, so the Angular UI has one error handler.
      properties:
        errorCode:
          type: string
          enum: [AUTH-401, AUTH-409, AUTH-410, VAL-422]
          description: |
            | Code | HTTP | Meaning |
            |---|---|---|
            | `AUTH-401` | 401 | Unauthorised or invalid token |
            | `AUTH-409` | 409 | Username or email already registered |
            | `AUTH-410` | 410 | One-time code wrong, spent or expired |
            | `VAL-422` | 422 | Invalid input |

            `AUTH-409` extends the platform error catalogue and is scoped to this service. The
            catalogue in `trade-api.yaml` has no registration-conflict code because registration is
            not a trading operation.
          example: AUTH-401
        message:
          type: string
          description: |
            Deliberately vague on this service. `Unauthorised` and `Registration failed` are the
            only two messages that should appear on a failure path, because a more helpful message
            tells an attacker which half of the credential pair was wrong. `AUTH-410` carries one
            fixed message for every way a code can fail.
          example: Unauthorised

security:
  - bearerAuth: []
